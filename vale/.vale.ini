# Vale over a docstring MIRROR: bin/sift docs-mirror writes each source file
# as <path>.md holding only its docstrings, at their original lines. So
# Vale's file:line is the source's once `.md` is stripped, which
# `bin/sift vale-sarif` does — SARIF that defnet's `ingest op=sarif`
# attributes to definitions with no new reader and no new surface.
# (Vale's [formats] mapping refused .cljs outright; the suffix is simpler.)
StylesPath = styles
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = Sift
