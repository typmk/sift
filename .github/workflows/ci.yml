name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: cdeps-${{ hashFiles('deps.edn') }}
          restore-keys: cdeps-
      - run: clojure -M:test

  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: cdeps-${{ hashFiles('deps.edn') }}
          restore-keys: cdeps-
      - run: clojure -M:parity > jvm.edn
      - run: clojure -M:cljs && node target/parity.js > node.edn
      - run: test -s jvm.edn && diff jvm.edn node.edn

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          bb: latest
      - run: |
          c=test/net/typemark/sift/corpus
          for k in refactor complexity security correctness; do bin/sift lint --category $k $c/clear; done
          for k in refactor security; do
            if bin/sift lint --category $k $c/flag > /dev/null; then echo "flag corpus reported no $k finding"; exit 1; fi
          done

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          clj-kondo: latest
      - run: clj-kondo --lint src script oracle/src bin/sift --fail-level warning
